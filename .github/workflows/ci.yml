# Runs on every push and pull request, so a broken build shows up on GitHub
# before Render or Vercel try to deploy it.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Benchmark (offline engine)
        working-directory: .
        run: python evaluation/run_evaluation.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same build contexts Render and docker compose use.
      - name: Build backend image
        run: docker build -t enterprise-brain-api ./backend
      - name: Smoke-test backend image
        run: |
          docker run -d --name api -p 8000:8000 -e ENVIRONMENT=production -e SECRET_KEY=ci-only-secret-key-0123456789abcdef enterprise-brain-api
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Build frontend image
        run: docker build -t enterprise-brain-web ./frontend
