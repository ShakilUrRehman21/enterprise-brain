# Render Blueprint: Docker backend + Postgres. The frontend deploys on Vercel
# (set BACKEND_API_URL there to this service's URL).
services:
  - type: web
    name: enterprise-brain-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-brain-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: enterprise-brain-db
    databaseName: enterprise_brain
