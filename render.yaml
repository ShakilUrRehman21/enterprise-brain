services:
  - type: web
    name: enterprise-brain-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_DEMO_AUTH
        value: "true"
      - key: SQLITE_FALLBACK_URL
        value: sqlite:///./enterprise_brain.db

